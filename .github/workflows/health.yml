# Upstream health check.
#
# The unit tests catch our own regressions. They cannot catch an ATS platform changing its
# response format — and that is the failure that actually breaks callers. This job calls the
# real endpoints on a schedule so a breakage is noticed by us, not by a user.
#
# On failure GitHub emails the repository owner, and the job also files (or updates) an issue
# and assigns it, so the alert arrives even if workflow email is muted.

name: health

on:
  schedule:
    # Every 6 hours. Offset from the hour because scheduled runs bunch up on the hour.
    - cron: "23 */6 * * *"
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # A weekly run on a different line does not prevent that, but it does make the
    # gap obvious in the run history if it ever happens.
    - cron: "11 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Live check against every supported ATS
        id: live
        shell: bash
        run: |
          # pipefail matters: without it the exit status is tee's, so a failing
          # check would be reported as a pass and the alert below would never fire.
          set -o pipefail
          node test/live-health.js --json | tee health.json

      - name: Human readable summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("health.json", "utf8")); }
            catch { console.log("The check did not produce a report - it failed before finishing."); process.exit(0); }
            const rows = d.results.map(r =>
              `| ${r.ok ? "pass" : "**fail**"} | ${r.provider}${r.label ? " (" + r.label + ")" : ""} | ${r.jobs} | ${r.reason || ""} |`
            ).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## ${d.failed === 0 ? "All checks passed" : d.failed + " check(s) failed"}\n\n` +
              `| result | provider | roles | detail |\n|---|---|---:|---|\n${rows}\n`);
          '

      - name: Open or update an issue when something upstream broke
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Upstream ATS health check is failing"
          BODY="The scheduled health check failed.

          A supported ATS platform has most likely changed its public API, so reads for that
          platform are broken for everyone using this library.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Reproduce locally:
          \`\`\`
          npm ci && node test/live-health.js
          \`\`\`

          A failing case can also mean the sample employer simply paused hiring. Check that first,
          and swap the sample in \`test/live-health.js\` if that is all it is."

          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee shunsukefuruyama || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi
